plan_name: Compact YAML v12 rollout plan for repeated components
version: "2.0"
generated_at: "2026-02-09"
status: ready_for_implementation
owner: specs-plugin

scope:
  repository: specs-plugin
  target_benchmark: benchmark/spec-report.md
  benchmark_source_schema: specs-plugin.agent_pack.v10.yaml.compact
  runtime_emitted_schema: specs-plugin.agent_pack.v11.yaml.compact
  target_schema: specs-plugin.agent_pack.v12.yaml.compact
  objective:
    - Reduce compact payload size without changing v11 behavior.
    - Introduce v12 as explicit opt-in with deterministic decoding rules.
    - Keep non-data sections unaffected (anatomy/layout/properties rendering on canvas).

assumptions:
  - v11 is the current compatibility contract for existing users.
  - Compact-mode payload shape changes are allowed only in v12.
  - Node-id based extraction is sufficient for MCP-first workflows.

non_goals:
  - No collector-level behavior changes for non-data sections.
  - No behavioral changes to non-compact schema (specs-plugin.agent_pack.v11.yaml).
  - No broad UI redesign; only schema/version controls and wording fixes.

baseline:
  source_of_truth:
    report_file: benchmark/spec-report.md
    embedded_payload_block: benchmark/spec-report.md#L253
  measured_on: "2026-02-09"
  report_file:
    size_chars: 160920
    line_count: 3976
  embedded_payload:
    size_chars: 146155
    line_count: 3724
    chunks_total: 13
    anatomy_items: 223
    repeats_items: 51
    repeat_items_overlapping_in_anatomy: 51
    text_index_items: 65
    instance_templates: 8
    deduplicated_instances: 51
  key_size_drivers:
    path_key_value_chars_total: 24784
    template_path_key_value_chars_total: 712
    repeat_diff_key_chars_total: 12650
    text_index_path_value_chars_total: 6353
    text_index_block_chars_total: 14772
    chunks_block_chars_total: 130212
  notes:
    - Baseline metrics above are from the embedded YAML payload block, not from generated runtime output.
    - Keep payload metrics and full-report metrics separate to avoid regression-analysis ambiguity.

current_contract_observations:
  - Runtime emits specs-plugin.agent_pack.v11.yaml.compact in compact mode.
  - Benchmark artifact still uses specs-plugin.agent_pack.v10.yaml.compact.
  - Repeated instances appear in both anatomy chunks and repeats chunks.
  - path_key exists in anatomy items, repeats template/item records, and text_index.path.
  - mcp_playbook currently prefers path_key.
  - Data section copy text references chunk_manifest even though payload root key is chunks.

preflight_blockers:
  - id: B1
    severity: high
    issue: "TypeScript typecheck currently fails before optimization work starts."
    evidence:
      - "npm run typecheck fails with existing errors in src/code.ts and section/helper files."
    required_resolution:
      - "Stabilize type baseline first or mark and isolate known failures with explicit owner/date."
  - id: B2
    severity: high
    issue: "No explicit schema version selector exists; compact mode currently always maps to v11 compact."
    required_resolution:
      - "Add explicit schema version branching with v11 default."
  - id: B3
    severity: medium
    issue: "Contract tests are weak for payload schema evolution."
    required_resolution:
      - "Add v11 snapshot/shape guards and v12 roundtrip decode tests."

compatibility_boundary:
  must_keep_stable:
    - specs-plugin.agent_pack.v11.yaml
    - specs-plugin.agent_pack.v11.yaml.compact
  breaking_changes_allowed_only_in:
    - specs-plugin.agent_pack.v12.yaml.compact
  rules:
    - v11 output must remain byte-for-byte stable for same input and settings.
    - v12 must be explicit opt-in; no silent migration.
    - Decoder helper must reconstruct v12 indexed diffs into key-value maps losslessly.

execution_strategy:
  - id: T0
    title: Measurement harness and fixture freeze
    priority: P0
    files:
      - benchmark/spec-report.md
      - scripts/benchmark-yaml-metrics.sh
      - benchmark/metrics-baseline.json
    tasks:
      - Add deterministic extractor for embedded YAML block from benchmark/spec-report.md.
      - Compute and persist metrics: chars, lines, chunk counts, path-related char totals, diff-key totals.
      - Freeze benchmark fixture hash and include in metrics output.
    checkpoints:
      - Script runs locally with one command and emits machine-readable JSON.
      - Baseline JSON matches values in this plan.
      - Metrics script is referenced from README benchmark section.

  - id: T1
    title: Schema version control and guardrails
    priority: P0
    files:
      - src/plugin/types.ts
      - src/plugin/sections/data-section.ts
      - src/ui-app.tsx
      - src/code.ts
    tasks:
      - Add explicit schema-version control for agent compact mode (v11 default, v12 opt-in).
      - Branch payload transform by schema version; keep current v11 path unchanged.
      - Fix helper copy text to reference chunks, not chunk_manifest.
    checkpoints:
      - v11 remains default behavior.
      - v12 can be selected explicitly.
      - No runtime behavior change when using existing default settings.

  - id: T2
    title: Implement v12 payload changes (O1/O2/O3)
    priority: P0
    files:
      - src/plugin/sections/data-section.ts
      - src/plugin/types.ts
      - src/plugin/helpers/anatomy-collector.ts
      - src/plugin/helpers/v12-repeat-diff.ts
    tasks:
      - "O1: Exclude repeat node_ids from anatomy chunks in v12 compact output only."
      - "O2: Remove path-heavy fields in v12 compact output (anatomy.items[].path_key, repeats[].template_path_key, repeats[].items[].path_key, text_index[].path)."
      - "O2: Update v12 mcp_playbook.preferred_keys to node-id-first list."
      - "O3: Encode repeats[].items[].diffs as indexed tuples against varying_keys."
      - "O3: Add decode helper to recover Record<string, string> from indexed tuples."
      - "O3: Ensure varying_keys ordering is deterministic (sorted, stable)."
    checkpoints:
      - v12 output omits specified path fields.
      - v12 repeat diff encode/decode roundtrip is lossless.
      - v12 anatomy has zero overlap with repeat item node_ids.
      - v11 path and diff structures remain unchanged.

  - id: T3
    title: Contract tests and regression matrix
    priority: P0
    files:
      - tests/unit/data-payload-contract.test.ts
      - tests/unit/anatomy-dedup.test.ts
      - tests/unit/yaml.test.ts
      - tests/ui.spec.ts
    tasks:
      - Add v11 contract tests asserting unchanged shape and key presence.
      - Add v12 contract tests asserting changed shape and key absence.
      - Add repeat diff roundtrip tests (indexed -> decoded map).
      - Add deterministic varying_keys order tests across repeated runs.
      - Update stale UI/code tests that reference obsolete schema strings.
    checkpoints:
      - New contract tests fail if v11 changes unintentionally.
      - v12 tests validate all planned breaking changes.
      - CI test output clearly separates v11 and v12 expectations.

  - id: T4
    title: Docs, migration notes, and benchmark refresh
    priority: P1
    files:
      - README.md
      - benchmark/spec-report.md
      - benchmark/YAML-plan.yaml
    tasks:
      - Add migration section: v11 -> v12 compact changes and decode usage.
      - Document extraction strategy shift (node_id-first) and fallback behavior.
      - Regenerate benchmark report with v12 enabled and include before/after metrics.
      - Record exact commands used for reproduction.
    checkpoints:
      - Docs include side-by-side example snippets (v11 vs v12 for repeats/text_index).
      - Benchmark section reports measured deltas from script output.
      - No stale references to chunk_manifest remain.

projected_outcome:
  estimated_reduction:
    delta_chars_range: [38000, 52000]
    delta_percent_range: [26.0, 35.6]
  confidence: medium
  caveats:
    - Size impacts are non-additive; overlap between O1/O2/O3 is expected.
    - Final numbers are valid only after v12 benchmark regeneration.

validation_matrix:
  required_commands:
    - npm run typecheck
    - npm run test:unit
    - npm run build
    - bash scripts/benchmark-yaml-metrics.sh benchmark/spec-report.md
  pass_criteria:
    - Typecheck passes with no new errors.
    - Unit tests pass, including new v11/v12 contract tests.
    - v11 output equivalence check passes (byte-for-byte for fixture input).
    - v12 metrics show expected reductions and no decode data loss.

risk_register:
  - id: R1
    risk: "Consumers rely on path_key for debugging/human traceability."
    mitigation:
      - Keep path_key in v11.
      - Document optional debug mode for v12 if needed later.
  - id: R2
    risk: "Indexed diffs reduce readability and can break clients."
    mitigation:
      - Provide decode helper + migration examples.
      - Add strict roundtrip tests and out-of-range index handling.
  - id: R3
    risk: "Determinism drift in varying_keys ordering across runs."
    mitigation:
      - Enforce deterministic sorting and assert in tests.
  - id: R4
    risk: "Type baseline instability hides true regressions."
    mitigation:
      - Resolve or isolate baseline type errors before rollout merge.

rollback_plan:
  - Keep v11 as default path throughout rollout.
  - If v12 regressions appear, disable v12 selection in UI while preserving code branch for fixes.
  - Do not remove v11 emit path until downstream clients confirm migration.

