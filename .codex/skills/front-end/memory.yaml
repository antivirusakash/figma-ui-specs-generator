decisions:
  - date: "2026-02-06"
    component: "Anatomy Visual System"
    decision: "Switch anatomy output to curated highlights with compact rows and in-artboard numbered overlays"
    rationale: "Dense screens became unreadable with full dumps and connector spaghetti; curated overlays preserve clarity."
    module_ref: "design-knowledge/hierarchy.md"
    alternatives_considered:
      - "Show every layer with full attribute dump"

  - date: "2026-02-06"
    component: "Preset Affordance + Text Fill Coverage"
    decision: "Make presets explicit 'Apply' actions with active confirmation, and add dedicated Text fill attribute extraction"
    rationale: "Removes ambiguity in UI behavior and ensures typography color is always represented in generated specs."
    module_ref: "design-knowledge/user-education.md"
    alternatives_considered:
      - "Keep preset buttons stateless with implicit behavior"
      - "Reuse generic Fill attribute for text nodes only"

  - date: "2026-02-06"
    component: "Plugin UI Information Architecture"
    decision: "Shift to education-first flow with guided steps, presets, and descriptive control hints"
    rationale: "Designers can understand output intent faster and configure reliably without external docs."
    module_ref: "design-knowledge/user-education.md"
    alternatives_considered:
      - "Keep flat control list with minimal copy"

  - date: "2026-02-06"
    component: "Specs Runtime + Layout Packaging"
    decision: "Balance multi-column sections by estimated height and emit compact data preview manifest"
    rationale: "Prevents long single-column blowups and keeps generated JSON parseable without giant text frames."
    module_ref: "Rules/core.md"
    alternatives_considered:
      - "Round-robin section placement"
      - "Render full chunk payload directly on canvas"

  - date: "2026-02-06"
    component: "Data JSON Section"
    decision: "Add agent-ready chunked schema with MCP playbook metadata"
    rationale: "Makes specs parseable for LLM agents while limiting payload size on dense components."
    module_ref: "Rules/core.md"
    alternatives_considered:
      - "Keep raw unbounded JSON dump"

  - date: "2026-02-06"
    component: "Layout Section Density"
    decision: "Render only ranked key layout nodes for artwork + compact table rows for details"
    rationale: "Prevents visual overload and unreadable overlays on complex screens."
    module_ref: "Rules/states.md"
    alternatives_considered:
      - "Render every layout node with full labels"

  - date: "2026-02-06"
    component: "Specs Frame Composition"
    decision: "Set fixed readable root width and stretch section cards across columns"
    rationale: "Prevents narrow/tiny-looking exports and improves consistent rhythm across large artboards."
    module_ref: "Rules/core.md"
    alternatives_considered:
      - "Leave root and section widths fully auto-sized"

  - date: "2026-02-06"
    component: "Specs Plugin Layout Artboard"
    decision: "Refactor layout section into metric panel + spec cards + legend-backed artwork"
    rationale: "Improves readability and visual hierarchy while keeping strict auto-layout composition."
    module_ref: "Rules/core.md"
    alternatives_considered:
      - "Keep single multiline text block with plain artwork"

  - date: "2026-02-06"
    component: "Specs Plugin UI Quality"
    decision: "Raise shared control primitives to 44px+ touch targets"
    rationale: "Front-end mobile ergonomics rule requires >=44px targets; primitive-level change prevents repeated overrides."
    module_ref: "Rules/mobile.md"
    alternatives_considered:
      - "Patch only page-level controls with ad-hoc class overrides"

  - date: "2026-02-06"
    component: "Specs Plugin Output Architecture"
    decision: "Force vertical section composition and scaled artwork overlays for multi-column stability"
    rationale: "Horizontal matrix layouts and unscaled overlays caused unreadable spec frames on dense mobile screens."
    module_ref: "Rules/states.md"
    alternatives_considered:
      - "Keep horizontal split panels with truncation only"
      - "Disable multi-column layout entirely"

  - date: "2026-02-06"
    component: "Specs Plugin Runtime"
    decision: "Use async text style assignment and enforce dynamic-page API guard test"
    rationale: "Figma dynamic-page blocks sync textStyleId/style APIs; regression guard prevents future runtime failures."
    module_ref: "Rules/components.md"
    alternatives_considered:
      - "Disable typography formatting"
      - "Switch manifest documentAccess to current-page"

  - date: "2026-02-06"
    component: "Specs Plugin Runtime"
    decision: "Replace synchronous instance mainComponent access with async getMainComponentAsync"
    rationale: "documentAccess dynamic-page rejects sync getters and caused runtime generation failures."
    module_ref: "Rules/components.md"
    alternatives_considered:
      - "Switch manifest to current-page"
      - "Keep sync access and catch errors"

  - date: "2026-02-06"
    component: "Specs Plugin UI"
    decision: "Add spec typography styles + modes controls"
    rationale: "Aligns UI controls and output formatting with specsplugin-docs feature list."
    module_ref: "Rules/typography.md"
    alternatives_considered:
      - "Leave typography formatting unimplemented"

  - date: "2026-02-05"
    component: "Specs Plugin UI"
    decision: "Adopted full shadcn + Radix primitives with Phosphor icons"
    rationale: "Align with component and icon rules while keeping accessible primitives"
    module_ref: "Rules/components.md"
    alternatives_considered:
      - "Custom HTML inputs"
      - "Lucide icons"

